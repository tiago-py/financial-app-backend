services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financial
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial
    ports:
      - "5432:5432"
    volumes:
      - financial_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - financial_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: financial
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["sh", "-c", "for file in /migrations/*.sql; do psql -h postgres -U financial -d financial -v ON_ERROR_STOP=1 -f $$file; done"]
    restart: "no"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://financial:financial@postgres:5432/financial?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: desenvolvimento-local-chave-com-32-caracteres
      JWT_TTL: 24h
      CORS_ORIGIN: http://localhost:3000
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@financial.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-altere-esta-senha-123}
    ports:
      - "8080:8080"

volumes:
  financial_postgres_data:
  financial_redis_data:
